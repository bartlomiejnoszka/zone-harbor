version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: {interval: weekly}
    groups:
      symfony: {patterns: ['symfony/*']}
      development: {dependency-type: development}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ['*']}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
